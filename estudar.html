<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudar e revisar</title><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/componentes.css"><link rel="stylesheet" href="css/responsivo.css"></head><body><a class="skip" href="#conteudo">Pular para o conteúdo</a><main id="conteudo"><nav class="breadcrumbs"><a href="index.html">Início</a><span>›</span><span>Estudar e revisar</span></nav><span class="eyebrow">ESTUDO ATIVO LOCAL</span><h1>Estudar e revisar</h1><p>Crie uma sessão com o conteúdo publicado. Suas avaliações e revisões ficam somente neste dispositivo.</p><section id="studySummary" class="study-summary" aria-label="Resumo de progresso"></section><section id="studySetup"><h2>Nova sessão</h2><div class="study-filters"><label>Nível<select id="studyLevel"><option value="">Todos</option></select></label><label>Painel<select id="studyPanel"><option value="">Todos</option></select></label><label>Subpainel<select id="studySubpanel"><option value="">Todos</option></select></label><label>Habilidade principal<select id="studySkill"><option value="">Todas</option></select></label><label>Origem<select id="studySource"><option value="all">Todas elegíveis</option><option value="favorites">Favoritos</option><option value="new">Ainda não estudadas</option><option value="due">Previstas para revisão</option></select></label><label>Modo<select id="studyMode"><option value="en-pt">Inglês → português</option><option value="pt-en">Português → inglês</option><option value="concept">Conceito → exemplos</option><option value="self">Autorrevisão</option></select></label><label>Quantidade<select id="studyLimit"><option>10</option><option>20</option><option>30</option></select></label></div><p id="eligibleCount" aria-live="polite"></p><div class="actions"><button id="startStudy" class="primary">Iniciar sessão</button><button id="resumeStudy" hidden>Continuar sessão</button></div></section><section id="studySession" hidden aria-live="polite"><div class="session-head"><div><strong id="sessionProgress"></strong><div class="progress"><i></i></div></div><button id="endStudy">Encerrar e salvar</button></div><article id="studyCard" class="study-card"></article></section></main><script src="js/estudo.js"></script></body></html>
